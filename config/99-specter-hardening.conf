# Specter OS kernel network hardening
# Install to /etc/sysctl.d/99-specter-hardening.conf
# Applied by systemd-sysctl very early in boot, before networking.

# Disable IPv6 entirely (Tor TransPort is IPv4-only here; IPv6 would bypass it).
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.lo.disable_ipv6 = 1

# Do not answer ICMP echo or broadcast probes.
net.ipv4.icmp_echo_ignore_all = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

# No redirects, no source routing, no forwarding.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.ip_forward = 0

# Do not leak uptime through TCP timestamps.
net.ipv4.tcp_timestamps = 0

# Hide kernel pointers and restrict dmesg (early-boot log) to root.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
